name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir ultimo ZIP
        run: |
          Z=$(ls ruta360_fase*.zip | sort -V | tail -1)
          echo "Usando $Z"
          rm -rf _unz
          unzip -o "$Z" -d _unz
          cp -r _unz/ruta360/. .
      - name: Verificar google-services.json
        run: test -f google-services.json || (echo "Falta google-services.json en la raiz" && exit 1)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Crear plataforma Android
        run: |
          flutter create --org ec.ruta360 --project-name ruta360 --platforms android .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ruta360-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
