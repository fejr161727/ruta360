name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir codigo
        run: |
          shopt -s nullglob
          for z in ruta360_fase*.zip; do unzip -o "$z" -d _unz; done
          cp -r _unz/ruta360/. .
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Crear plataforma Android
        run: |
          flutter create --org com.example --project-name ruta360 --platforms android .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ruta360-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
